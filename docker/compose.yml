services:
  dsh-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
      args:
        NODE_VERSION: ${NODE_VERSION:-24-bookworm-slim}
        DSH_CLIENT_COMMIT_HASH: ${DSH_CLIENT_COMMIT_HASH:?set DSH_CLIENT_COMMIT_HASH to git rev-parse HEAD}
        DSH_RESOURCE_DOWNLOAD_TIMEOUT_MS: ${DSH_RESOURCE_DOWNLOAD_TIMEOUT_MS:-600000}
    image: ${ZHISHU_HARNESS_IMAGE:-zhishu-harness:local}
    environment:
      DSH_HOME: /storage-root-jfs/user/dsh-home
      DSH_WORKSPACE_ROOT: /storage-root-jfs/user
      DSH_DEFAULT_WORKSPACE: /storage-root-jfs/user/workspace
      DSH_DEFAULT_WORKSPACE_TITLE: 默认工作区
      DSH_WEB_PORT: 3080
      DSH_INTERNAL_PORT: ${DSH_INTERNAL_PORT:-3081}
      DSH_PUBLIC_AUTHORITY: ${DSH_PUBLIC_AUTHORITY:-dsh-web:3081}
      DSH_PRIMARY_RUNTIME: /opt/dsh-runtime/primary-runtime
      PYTHONDONTWRITEBYTECODE: '1'
      NODE_ENV: production
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - type: bind
        source: ${DSH_USER_ROOT_PATH:?set DSH_USER_ROOT_PATH to /storage-root-jfs/user-<userID>}
        target: /storage-root-jfs/user
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - apparmor=gcs-harness-bwrap
      - seccomp=./security/seccomp-bwrap.json
      - systempaths=unconfined
    mem_limit: ${DSH_MEMORY_LIMIT:-2g}
    cpus: ${DSH_CPU_LIMIT:-2}
    pids_limit: 1024
    networks: [gcs-dsh-users]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'curl --silent --output /dev/null --max-time 0.5 "http://127.0.0.1:$${DSH_INTERNAL_PORT}/"']
      interval: 1s
      timeout: 1s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

networks:
  gcs-dsh-users:
    name: ${GCS_DSH_NETWORK:-gcs-dsh-users}
    external: true
