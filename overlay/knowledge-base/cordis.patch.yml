# Preinstalled knowledge-base main panel (WeKnora iframe UI, like Plugins).
# Desktop mints SSO via zhishuPlatform IPC; container / dsh web asks the
# embedding model page over zhishu:sso-* postMessage. Native chat stays on the
# main conversation; the panel's “AI助手” calls the same startSession as 新会话.
- insert:
    - id: zhishu-knowledge-base
      name: ./index.js
      config:
        desktopBaseUrl: !!js "process.env.ELECTRON_RUN_AS_NODE === '1' ? process.env.WEKNORA_BASE_URL : undefined"
