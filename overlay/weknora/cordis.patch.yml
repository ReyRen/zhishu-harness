# Installed by the private Web and Desktop assemblies, outside user profiles.
- insert:
    - id: weknora
      name: '@wxg-prc-cpg/dsh-weknora'
      config:
        baseUrl: !!js process.env.WEKNORA_BASE_URL ?? 'http://localhost:8080/api/v1'
        apiKey: !!js process.env.WEKNORA_API_KEY
        tenantId: !!js process.env.WEKNORA_TENANT_ID
        knowledgeBaseIds: !!js (process.env.WEKNORA_KNOWLEDGE_BASE_IDS ?? '').split(',').map(id => id.trim()).filter(Boolean)
        agentId: !!js process.env.WEKNORA_AGENT_ID
        resourceUrls: !!js process.env.WEKNORA_RESOURCE_URLS ?? 'handle'
