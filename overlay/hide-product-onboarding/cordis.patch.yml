# First-run product dialogs are not used. The preview notice is shadowed by
# this plugin's client. The API-key step stays registered but does not open.
#
# The official DeepSeek routes call the public API unless an endpoint is
# configured. This deployment stays on the LAN and adds its own providers.
- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

# Platform model definitions are stored once in the authenticated model registry.
- id: llm-pi-ai
  disabled: true

- id: ui-settings-models
  config:
    credentialOnboarding: false
    platformModelManagement: true

- insert:
    - id: zhishu-hide-product-onboarding
      name: ./index.js
