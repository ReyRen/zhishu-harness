# Preinstalled market. The package lives in third-party/dshmarket and is an
# apps/cli dependency, so the running copy is the installation copy. This row
# is skipped when the user profile already has a dshmarket bundle layer,
# because that layer inserts the same id.
- insert:
    - id: dsh-market
      name: dshmarket
      config:
        profile: web
        allowRestart: false
