# Private npm for the plugin market. No uplink: only tarballs published
# into this registry can be installed.
# npm publish embeds the tarball as base64 in the JSON body; pdfjs-dist ~8.5MB
# becomes >10MB, so raise the default 10mb limit.
max_body_size: 100mb
storage: ./storage
auth:
  htpasswd:
    file: ./htpasswd
    max_users: 1000
uplinks: {}
packages:
  "**":
    access: $all
    publish: $all
    unpublish: $all
log:
  type: stdout
  format: pretty
  level: warn
listen: 127.0.0.1:4873
security:
  api:
    legacy: true
